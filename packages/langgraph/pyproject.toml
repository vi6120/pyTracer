[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-langgraph"
version = "0.1.4"
description = "pyTracer adapter for LangGraph / LangChain - auto-instrument agents via a callback handler."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Vikas Ramaswamy" }, { name = "Nagesha Sheshadri" }]
dependencies = [
    "pytracer-sdk==0.1.4",
    # The oldest langchain-core CI verifies (what LangGraph 1.2.11 requires).
    "langchain-core>=1.4.7",
]

[project.urls]
Homepage = "https://pytracer.com"
Documentation = "https://pytracer.com/docs.html"
Repository = "https://github.com/vi6120/pyTracer"
Issues = "https://github.com/vi6120/pyTracer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "langgraph>=1.2.11",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytracer_langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["langchain_core.*", "langgraph.*"]
ignore_missing_imports = true
