version: 2
updates:
  # Keep GitHub Actions pinned and patched.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dependency security + updates for every Python package in the monorepo.
  - package-ecosystem: "pip"
    directories:
      - "/packages/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-deps:
        patterns:
          - "*"
