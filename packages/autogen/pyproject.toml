[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-autogen"
version = "0.1.4"
description = "pyTracer adapter for AutoGen - capture agent runs via an OpenTelemetry exporter."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Vikas Ramaswamy" }, { name = "Nagesha Sheshadri" }]
dependencies = [
    "pytracer-sdk==0.1.4",
    # AutoGen is not a dependency: the exporter also serves other GenAI-instrumented
    # libraries, and every autogen-core release is 0.4.0 or later, all of which CI
    # verifies (see pytracer_autogen.versions). 1.27.0 is AutoGen 0.4.0's floor.
    "opentelemetry-sdk>=1.27.0",
]

[project.urls]
Homepage = "https://pytracer.com"
Documentation = "https://pytracer.com/docs.html"
Repository = "https://github.com/vi6120/pyTracer"
Issues = "https://github.com/vi6120/pyTracer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "autogen-core>=0.4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytracer_autogen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "autogen_core.*"]
ignore_missing_imports = true
