name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # Pin ruff so the gate is reproducible: the packages rely on ruff's
      # default rule set (no explicit select), which later ruff releases expand,
      # so a floating version would fail CI on unrelated ruff upgrades. Bump this
      # deliberately after re-checking the tree against the new version.
      - name: Install ruff
        run: python -m pip install "ruff==0.5.7"

      - name: Lint every package
        run: |
          failed=0
          for d in packages/*/; do
            echo "::group::$(basename "$d")"
            ruff check "$d" || failed=1
            echo "::endgroup::"
          done
          exit $failed

      # The examples are what new users copy first, so hold them to the same bar.
      - name: Lint the examples
        run: ruff check examples
