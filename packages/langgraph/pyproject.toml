[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-langgraph"
version = "0.1.0"
description = "pyTracer adapter for LangGraph / LangChain - auto-instrument agents via a callback handler."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Vikas Ramaswamy" }, { name = "Nagesha Sheshadri" }]
dependencies = [
    "pytracer-sdk==0.1.0",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "langgraph>=0.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytracer_langgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["langchain_core.*", "langgraph.*"]
ignore_missing_imports = true
