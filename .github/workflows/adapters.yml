name: adapters

# The adapter replay acceptance tests need the real frameworks and, for the
# gateway-to-store path, ClickHouse. The main test job installs neither, so those
# tests skip there; this job runs them with pytest's skip markers disabled, so a
# missing framework fails instead of passing quietly. The all-frameworks group
# installs the four together, at the versions pip resolves for them jointly
# (CrewAI's openai<3 caps OpenAI Agents at 0.20.0, and AutoGen's protobuf pin
# selects googleapis-common-protos 1.75.0); the other groups cover each framework
# at newer versions than that combination allows. Framework versions are pinned to
# the ones the adapters were verified against; bump them deliberately.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: langgraph-autogen
            adapters: "packages/langgraph packages/autogen"
            frameworks: >-
              langgraph==1.2.11 langgraph-prebuilt==1.1.0
              autogen-agentchat==0.7.5 autogen-core==0.7.5
              opentelemetry-instrumentation-openai-v2==2.3b0 wrapt<2 openai httpx
            store_tests: "langgraph or autogen"
          - group: crewai
            adapters: "packages/crewai"
            frameworks: "crewai==1.15.20 httpx"
            store_tests: "crewai"
          - group: openai-agents
            adapters: "packages/openai-agents"
            frameworks: "openai-agents==0.22.1 httpx"
            store_tests: "openai_agents"
          - group: all-frameworks
            adapters: "packages/langgraph packages/autogen packages/crewai packages/openai-agents"
            frameworks: >-
              crewai==1.15.30 openai-agents==0.20.0
              autogen-agentchat==0.7.5 autogen-core==0.7.5
              langgraph==1.2.17 langgraph-prebuilt==1.1.1 httpx
            store_tests: "langgraph or autogen or crewai or openai_agents"
            # The openai-v2 instrumentation test runs in the langgraph-autogen group.
            pytest_args: "--deselect tests/test_genai_instrumentation.py"
    name: acceptance (${{ matrix.group }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8-alpine@sha256:b002e56ed5c16e224c312527f6fcba7e77216fec5d7a88a7828f59efc614feb5
        env:
          CLICKHOUSE_DB: pytracer
          CLICKHOUSE_USER: pytracer
          CLICKHOUSE_PASSWORD: pytracer
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      # Matrix values reach the shell as environment variables, not pasted into the
      # script: a specifier like wrapt<2 would otherwise be read as a redirection.
      - name: Install the core packages, this group's adapters and frameworks
        # One install command, so pip resolves the frameworks together.
        env:
          ADAPTERS: ${{ matrix.adapters }}
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          python -m pip install --upgrade pip
          editable=""
          for d in packages/sdk packages/replay packages/stores packages/gateway packages/cli $ADAPTERS; do
            editable="$editable -e $d"
          done
          python -m pip install $editable $FRAMEWORKS "pytest>=8" "pytest-asyncio>=0.23"

      - name: Run the adapter suites and the gateway-to-store acceptance test, no skips
        env:
          ADAPTERS: ${{ matrix.adapters }}
          STORE_TESTS: ${{ matrix.store_tests }}
          PYTEST_ARGS: ${{ matrix.pytest_args }}
        run: |
          set -o pipefail
          failed=0
          for d in $ADAPTERS; do
            echo "::group::$d"
            ( cd "$d" && python -m pytest -q -rs -p no:skipping $PYTEST_ARGS ) | tee -a results.txt || failed=1
            echo "::endgroup::"
          done
          echo "::group::gateway to store"
          ( cd packages/stores && python -m pytest -q -rs -p no:skipping \
              tests/test_adapter_replay_through_store.py -k "$STORE_TESTS" ) | tee -a results.txt || failed=1
          echo "::endgroup::"
          # Nothing may skip here (e.g. ClickHouse unreachable, or a framework missing).
          if grep -qE "[0-9]+ skipped" results.txt; then echo "tests were skipped"; failed=1; fi
          exit $failed
