name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install all packages (editable) and test tools
        run: |
          python -m pip install --upgrade pip
          # One install so the local editable packages satisfy the cross-package pins.
          editable=""
          for d in packages/*/; do editable="$editable -e $d"; done
          python -m pip install $editable
          python -m pip install "pytest>=8" "pytest-asyncio>=0.23" "hypothesis>=6.100"

      - name: Run the full test suite
        run: |
          failed=0
          for d in packages/*/; do
            [ -d "${d}tests" ] || continue
            echo "::group::$(basename "$d")"
            ( cd "$d" && python -m pytest -q ) || failed=1
            echo "::endgroup::"
          done
          exit $failed

  # The Redis queue tests (durability across a restart, and the writer surviving
  # a Redis outage) skip without Redis, so the job above never runs them. This one
  # runs them against a real Redis with skips disabled, so a missing Redis fails.
  redis-queue:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the gateway with its Redis extra
        run: |
          python -m pip install --upgrade pip
          # httpx for Starlette's TestClient, which the HTTP-level test uses.
          python -m pip install -e packages/sdk -e packages/stores -e "packages/gateway[redis]" \
            httpx==0.28.1 "pytest>=8" "pytest-asyncio>=0.23"

      - name: Run the Redis queue tests, no skips
        run: |
          cd packages/gateway
          python -m pytest -q -rs -p no:skipping tests/test_redis_queue.py
