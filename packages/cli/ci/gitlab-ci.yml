# Navik agent-tests GitLab CI template - a thin wrapper around `navik run`.
# Include this job in your .gitlab-ci.yml. JUnit output is surfaced in the
# merge-request test report.
navik-agent-tests:
  image: python:3.12
  script:
    - pip install navik-cli
    - navik run tests/collection.yaml --junit navik-results.xml --comment navik-comment.md
  artifacts:
    when: always
    paths:
      - navik-comment.md
    reports:
      junit: navik-results.xml
