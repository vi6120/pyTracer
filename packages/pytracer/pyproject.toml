[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-all"
version = "0.1.1"
description = "pyTracer - install the full agent test and replay platform."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Vikas Ramaswamy" }, { name = "Nagesha Sheshadri" }]
# Installing `pytracer` pulls in every component of the platform.
dependencies = [
    "pytracer-sdk==0.1.1",
    "pytracer-stores==0.1.1",
    "pytracer-gateway==0.1.1",
    "pytracer-replay==0.1.1",
    "pytracer-runner==0.1.1",
    "pytracer-registry==0.1.1",
    "pytracer-cli==0.1.1",
]

[project.urls]
Homepage = "https://pytracer.com"
Documentation = "https://pytracer.com/docs.html"
Repository = "https://github.com/vi6120/pyTracer"
Issues = "https://github.com/vi6120/pyTracer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytracer"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true
