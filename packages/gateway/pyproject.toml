[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-gateway"
version = "0.1.0"
description = "pyTracer ingestion gateway - receives spans and writes them through to the trace store."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "pyTracer" }]
dependencies = [
    "pytracer-sdk==0.1.0",
    "pytracer-stores==0.1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Durable ingest queue backend (PYTRACER_GATEWAY_QUEUE_BACKEND=redis).
redis = ["redis>=5.0"]
# Prometheus /metrics endpoint for scraping under load tests.
metrics = ["prometheus-client>=0.20"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytracer_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true

# prometheus-client ships no type stubs; the [metrics] code guards its use.
[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
