[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-runner"
version = "0.0.1"
description = "pyTracer per-commit isolated runner - reproduce a trace against any branch or commit."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "pyTracer" }]
dependencies = [
    "pytracer-replay==0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytracer_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true
