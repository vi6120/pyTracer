name: Publish to PyPI

# Builds all pyTracer packages and publishes them via PyPI Trusted Publishing
# (OIDC, no stored token). Publishing to PyPI happens when a GitHub Release is
# published; a manual run can target TestPyPI for a dry run.
#
# One-time setup: configure a Trusted Publisher for each package on PyPI (and
# TestPyPI) pointing at this repository and this workflow file. See RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - name: Build all packages
        run: |
          rm -rf dist dist-meta && mkdir -p dist dist-meta
          # Component packages into dist/.
          for p in sdk stores gateway replay runner registry cli \
                   langgraph openai-agents crewai autogen; do
            python -m build --outdir dist "packages/$p"
          done
          # The pytracer-all meta-package pins the others with ==, so build it into
          # a separate dir and publish it last (see the publish job), to avoid a
          # window where it advertises a version whose pinned deps are not yet on
          # the index.
          python -m build --outdir dist-meta "packages/pytracer"
          ls -1 dist dist-meta
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist
            dist-meta

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: .
      # Publish the component packages first, then the pytracer-all meta-package,
      # so pytracer-all only becomes installable once its pinned deps are live.
      - name: Publish components to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
      - name: Publish pytracer-all to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-meta/
      - name: Publish components to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
      - name: Publish pytracer-all to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-meta/
