# pyTracer "try on this branch".
#
# Comment `/pytracer try` on a pull request to reproduce the captured failure on
# that PR's branch, with the recorded model and tool responses held frozen, and
# get a fixed / still-failing / diverged verdict posted back as a comment.
#
# Drop this in as `.github/workflows/pytracer-try-on-branch.yml`. Adjust the
# collection path, the frozen trace, and the trigger phrase for your project.
#
# Security: a comment-triggered workflow runs in your repository with a token that
# can write to pull requests, while the PR's code may come from anyone (a fork).
# So only owners, members and collaborators can trigger it, the PR's code runs in a
# throwaway Docker container that never sees the token, and no credentials are left
# in the checkout. Keep all three if you adapt it; never switch to
# `--isolation local` on a public repository. See SECURITY.md, "Threat model".
name: pyTracer try on this branch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  try:
    # Only pull-request comments that ask for it, from people with write access.
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/pytracer try') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the PR base branch
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('base', pr.data.base.ref);

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false  # no token left in .git/config for the PR's code

      - name: Make the base and PR head available as local branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE: ${{ steps.pr.outputs.base }}  # an env var, not pasted into the script
          PR: ${{ github.event.issue.number }}
        run: |
          # The token is given to this one command, never written to .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags --force origin \
            "refs/heads/$BASE:refs/heads/pytracer-base" \
            "refs/pull/$PR/head:refs/heads/pytracer-head"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pytracer
        run: pip install "pytracer-cli[runner]"

      - name: Reproduce on the PR branch and comment the verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # `|| true` keeps the job green when the branch has not fixed everything;
          # drop it to turn "still failing" into a red check.
          pytracer reproduce \
            --repo . \
            --baseline pytracer-base \
            --branch pytracer-head \
            --collection tests/collection.yaml \
            --isolation docker \
            --freeze-trace traces/failure.jsonl \
            --trace-dest traces/failure.jsonl \
            --pr ${{ github.event.issue.number }} || true
