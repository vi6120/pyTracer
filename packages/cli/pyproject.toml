[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navik-cli"
version = "0.0.1"
description = "Navik CLI - run agent test collections locally and in CI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Navik" }]
dependencies = [
    "navik-sdk==0.0.1",
    "navik-replay==0.0.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
navik = "navik_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/navik_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Typer uses typer.Option/Argument calls as parameter defaults by design.
"src/navik_cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
