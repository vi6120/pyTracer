name: perf

# Fails a pull request that makes the SDK's hot path slower: benchmarks/overhead/gate.py
# times the change's SDK and its base branch's SDK in the same job, in alternating
# rounds, and compares the time each adds per span.
on:
  pull_request:
    paths:
      - "packages/sdk/**"
      - "benchmarks/overhead/**"
      - ".github/workflows/perf.yml"

permissions:
  contents: read

jobs:
  sdk-overhead:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the SDK's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/sdk

      - name: Check out the base branch beside the change
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git worktree add "$RUNNER_TEMP/base" "origin/$BASE_REF"

      - name: Compare the SDK overhead with the base branch
        run: python benchmarks/overhead/gate.py --base "$RUNNER_TEMP/base/packages/sdk/src" --head packages/sdk/src
