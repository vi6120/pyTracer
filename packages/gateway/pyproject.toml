[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navik-gateway"
version = "0.0.1"
description = "Navik ingestion gateway - receives spans and writes them through to the trace store."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Navik" }]
# navik-sdk (Span schema) and navik-stores (TraceStore) are sibling packages in the same venv.
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/navik_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true
