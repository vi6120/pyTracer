[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-registry"
version = "0.1.2"
description = "pyTracer collaboration registry - versioned, forkable, access-controlled test collections."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Vikas Ramaswamy" }, { name = "Nagesha Sheshadri" }]
dependencies = [
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://pytracer.com"
Documentation = "https://pytracer.com/docs.html"
Repository = "https://github.com/vi6120/pyTracer"
Issues = "https://github.com/vi6120/pyTracer/issues"

[project.optional-dependencies]
# HTTP API in front of the registry library (uvicorn pytracer_registry.api:build_default_app).
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytracer_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true
