[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-reproduce-demo"
version = "0.0.0"
description = "A throwaway agent package for the pyTracer cross-branch reproduction demo."
requires-python = ">=3.10"
dependencies = [
    "pytracer-sdk>=0.1.0",
    "pytracer-cli>=0.1.0",
    "pytracer-replay>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["demo_agent"]
