name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history, not just the tip
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip the SARIF artifact upload (it fails when Actions artifact storage
          # is full); the scan's exit code is what gates the build.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # Uses the repo's .gitleaks.toml config automatically.
