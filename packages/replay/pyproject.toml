[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "navik-replay"
version = "0.0.1"
description = "Navik replay & test engine - deterministic replay, assertions, diffing, and cross-branch classification."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Navik" }]
dependencies = [
    "navik-sdk==0.0.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/navik_replay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true
