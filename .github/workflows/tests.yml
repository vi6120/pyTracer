name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install all packages (editable) and test tools
        run: |
          python -m pip install --upgrade pip
          # One install so the local editable packages satisfy the cross-package pins.
          editable=""
          for d in packages/*/; do editable="$editable -e $d"; done
          python -m pip install $editable
          python -m pip install "pytest>=8" "pytest-asyncio>=0.23" "hypothesis>=6.100"

      - name: Run the full test suite
        run: |
          failed=0
          for d in packages/*/; do
            [ -d "${d}tests" ] || continue
            echo "::group::$(basename "$d")"
            ( cd "$d" && python -m pytest -q ) || failed=1
            echo "::endgroup::"
          done
          exit $failed
