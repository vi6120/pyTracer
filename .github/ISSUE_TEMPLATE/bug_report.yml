name: Bug report
description: Report a problem with pyTracer
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please search existing issues first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal sequence that triggers the problem, ideally with code.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: pyTracer version
      placeholder: e.g. pytracer-sdk 0.0.1
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Which package is affected?
      options:
        - sdk
        - gateway
        - stores
        - replay
        - runner
        - registry
        - cli
        - langgraph
        - openai-agents
        - crewai
        - autogen
        - not sure / other
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: Environment
      description: Python version, OS, and framework (LangGraph, CrewAI, etc.) if relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: shell
    validations:
      required: false
