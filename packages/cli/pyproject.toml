[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-cli"
version = "0.1.0"
description = "pyTracer CLI - run agent test collections locally and in CI."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "pyTracer" }]
dependencies = [
    "pytracer-sdk==0.1.0",
    "pytracer-replay==0.1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Trace browsing / recording commands need the store client.
stores = ["pytracer-stores==0.1.0"]
# The reproduce command needs the cross-branch runner.
runner = ["pytracer-runner==0.1.0"]
dev = [
    "pytest>=8.0",
    "pytracer-stores==0.1.0",
    "pytracer-runner==0.1.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
pytracer = "pytracer_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pytracer_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Typer uses typer.Option/Argument calls as parameter defaults by design.
"src/pytracer_cli/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
