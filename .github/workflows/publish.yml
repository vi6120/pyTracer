name: Publish to PyPI

# Builds all pyTracer packages and publishes them via PyPI Trusted Publishing
# (OIDC, no stored token). Publishing to PyPI happens when a GitHub Release is
# published; a manual run can target TestPyPI for a dry run.
#
# Every file uploaded to PyPI carries a PEP 740 attestation (signed provenance), made
# by the publish action. On a release, the built files and an SBOM (CycloneDX, the
# pytracer-all install as it resolves at build time) are also attested with GitHub's
# build provenance and attached to the GitHub Release.
#
# One-time setup: configure a Trusted Publisher for each package on PyPI (and
# TestPyPI) pointing at this repository and this workflow file. See RELEASING.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - name: Build all packages
        run: |
          rm -rf dist dist-meta && mkdir -p dist dist-meta
          # Component packages into dist/.
          for p in sdk stores gateway replay runner registry cli \
                   langgraph openai-agents crewai autogen agent-framework \
                   claude-agent-sdk; do
            python -m build --outdir dist "packages/$p"
          done
          # The pytracer-all meta-package pins the others with ==, so build it into
          # a separate dir and publish it last (see the publish job), to avoid a
          # window where it advertises a version whose pinned deps are not yet on
          # the index.
          python -m build --outdir dist-meta "packages/pytracer"
          ls -1 dist dist-meta
      - name: Write the SBOM (pytracer-all as it installs from these files)
        run: |
          python -m pip install cyclonedx-bom==8.0.1
          # A venv without pip, so the SBOM lists only what pytracer-all installs.
          python -m venv --without-pip "$RUNNER_TEMP/sbom-env"
          python -m pip --python "$RUNNER_TEMP/sbom-env/bin/python" install --find-links dist dist-meta/*.whl
          version=$(ls dist-meta/*.whl | sed -E 's/.*pytracer_all-([^-]+)-.*/\1/')
          mkdir -p dist-sbom
          cyclonedx-py environment --of JSON --output-reproducible \
            --pyproject packages/pytracer/pyproject.toml \
            -o "dist-sbom/pytracer-all-$version.cdx.json" "$RUNNER_TEMP/sbom-env/bin/python"
          ls -1 dist-sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist
            dist-meta
            dist-sbom

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      # Publish the component packages first, then the pytracer-all meta-package,
      # so pytracer-all only becomes installable once its pinned deps are live.
      - name: Publish components to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
      - name: Publish pytracer-all to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist-meta/
          attestations: true
      - name: Publish components to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
      - name: Publish pytracer-all to PyPI
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist-meta/
          attestations: true

  # On a release only: attest the built files and the SBOM with GitHub's build
  # provenance (check with `gh attestation verify <file> --repo vi6120/pyTracer`), and
  # attach them to the release. Runs after publishing, so the release carries exactly
  # the files that went to PyPI.
  release-assets:
    if: github.event_name == 'release'
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload release assets
      id-token: write  # sign the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            dist-meta/*
            dist-sbom/*
      - name: Attach the files and the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* dist-meta/* dist-sbom/* --repo "$GITHUB_REPOSITORY" --clobber
