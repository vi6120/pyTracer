[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytracer-openai-agents"
version = "0.1.0"
description = "pyTracer adapter for the OpenAI Agents SDK - auto-instrument agents via a tracing processor."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "pyTracer" }]
dependencies = [
    "pytracer-sdk==0.1.0",
    "openai-agents>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytracer_openai_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["agents.*"]
ignore_missing_imports = true
