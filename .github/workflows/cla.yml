name: CLA Assistant

# Gates pull requests on a signed Contributor License Agreement (CLA.md).
# A first-time contributor is asked to sign by commenting the signature phrase;
# their signature is stored in this repo under signatures/. The check re-runs on
# that comment and lets the PR proceed once signed.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA check
        # CLA Assistant Lite. The upstream repo is archived but frozen and
        # functional; pinned to its last release. Consider hosted cla-assistant.io
        # if you later want a maintained service instead.
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/vi6120/pyTracer/blob/main/CLA.md
          branch: main
          allowlist: vi6120,dependabot[bot],github-actions[bot]
