# Navik backing services for local development.
# Trace store (ClickHouse) + mock store (PostgreSQL).
# Start with: docker compose up -d   (requires Docker Desktop running)

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: navik-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native protocol
    environment:
      CLICKHOUSE_DB: navik
      CLICKHOUSE_USER: navik
      CLICKHOUSE_PASSWORD: navik
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: navik-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: navik
      POSTGRES_USER: navik
      POSTGRES_PASSWORD: navik
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navik -d navik"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clickhouse-data:
  postgres-data:
